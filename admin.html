<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Western Mona Admin Dashboard</title>

<style>
:root{
--gold:#d8ad4a;
--gold2:#f1cf73;
--black:#060606;
--dark:#101010;
--card:#181818;
--border:#302a20;
--muted:#aaa;
--green:#36c275;
--red:#e05252;
--blue:#4d9cff;
--yellow:#e5b94c;
}

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,sans-serif;
background:var(--black);
color:white;
line-height:1.5;
}

button,
input,
select{
font-family:inherit;
}

button{
cursor:pointer;
}

.login-page{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
background:
radial-gradient(circle at 50% 20%,#3c2b0d55,transparent 35%),
#060606;
}

.login-box{
width:min(430px,100%);
background:#151515;
border:1px solid var(--border);
border-radius:18px;
padding:35px;
box-shadow:0 20px 60px #000;
}

.logo{
text-align:center;
margin-bottom:25px;
}

.logo img{
width:80px;
height:80px;
border-radius:50%;
object-fit:cover;
border:2px solid var(--gold);
}

.logo h1{
font-family:Georgia,serif;
font-size:25px;
margin-top:12px;
}

.logo p{
color:var(--muted);
font-size:13px;
}

.login-box label{
display:block;
font-size:13px;
margin-bottom:6px;
color:#ddd;
}

.login-box input{
width:100%;
padding:13px;
margin-bottom:16px;
background:#080808;
color:white;
border:1px solid #393939;
border-radius:7px;
}

.btn{
border:0;
border-radius:7px;
padding:11px 16px;
background:var(--gold);
color:#000;
font-weight:800;
}

.btn:hover{
background:var(--gold2);
}

.btn-full{
width:100%;
}

.error{
color:#ff8585;
background:#351818;
border:1px solid #632b2b;
padding:10px;
border-radius:7px;
margin-bottom:15px;
font-size:13px;
}

.hidden{
display:none!important;
}

/* DASHBOARD */

.dashboard{
display:none;
min-height:100vh;
}

.topbar{
height:72px;
background:#0d0d0d;
border-bottom:1px solid var(--border);
display:flex;
align-items:center;
justify-content:space-between;
padding:0 25px;
position:sticky;
top:0;
z-index:50;
}

.topbar-left{
display:flex;
align-items:center;
gap:12px;
}

.topbar-logo{
width:42px;
height:42px;
border-radius:50%;
object-fit:cover;
border:1px solid var(--gold);
}

.topbar h1{
font-family:Georgia,serif;
font-size:20px;
}

.logout{
background:transparent;
color:#fff;
border:1px solid #555;
padding:8px 13px;
border-radius:6px;
}

.logout:hover{
border-color:var(--gold);
color:var(--gold2);
}

.container{
width:min(1400px,94%);
margin:auto;
padding:30px 0;
}

.welcome{
margin-bottom:25px;
}

.welcome h2{
font-family:Georgia,serif;
font-size:32px;
}

.welcome p{
color:var(--muted);
}

/* STATISTICS */

.stats{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:15px;
margin-bottom:25px;
}

.stat{
background:var(--card);
border:1px solid var(--border);
border-radius:12px;
padding:20px;
}

.stat-title{
color:var(--muted);
font-size:13px;
}

.stat-number{
font-size:30px;
font-weight:800;
margin-top:5px;
color:var(--gold2);
}

.stat.pending .stat-number{
color:var(--yellow);
}

.stat.confirmed .stat-number{
color:var(--green);
}

.stat.completed .stat-number{
color:var(--blue);
}

.stat.cancelled .stat-number{
color:var(--red);
}

/* CONTROLS */

.controls{
background:var(--card);
border:1px solid var(--border);
border-radius:12px;
padding:18px;
margin-bottom:20px;
display:grid;
grid-template-columns:2fr 1fr;
gap:12px;
}

.controls input,
.controls select{
width:100%;
padding:11px;
background:#080808;
border:1px solid #393939;
border-radius:7px;
color:white;
}

.controls input:focus,
.controls select:focus{
outline:none;
border-color:var(--gold);
}

/* BOOKINGS */

.bookings{
display:grid;
gap:15px;
}

.booking{
background:var(--card);
border:1px solid var(--border);
border-radius:14px;
padding:20px;
}

.booking:hover{
border-color:#574522;
}

.booking-header{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:15px;
margin-bottom:18px;
}

.reference{
color:var(--gold2);
font-weight:800;
font-size:17px;
}

.date-time{
font-size:13px;
color:var(--muted);
margin-top:4px;
}

.status{
display:inline-block;
padding:5px 10px;
border-radius:20px;
font-size:11px;
font-weight:800;
text-transform:uppercase;
}

.status-pending{
background:#4b3a16;
color:#f5d66f;
}

.status-confirmed{
background:#173c27;
color:#72e09a;
}

.status-completed{
background:#183452;
color:#79b8ff;
}

.status-cancelled{
background:#471d1d;
color:#ff8c8c;
}

.booking-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:14px;
}

.info{
background:#0d0d0d;
padding:12px;
border-radius:8px;
}

.info-label{
display:block;
font-size:11px;
color:#777;
text-transform:uppercase;
margin-bottom:3px;
}

.info-value{
font-size:14px;
word-break:break-word;
}

.booking-actions{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:18px;
padding-top:15px;
border-top:1px solid #292929;
}

.action{
border:0;
border-radius:6px;
padding:9px 12px;
font-size:12px;
font-weight:700;
}

.confirm{
background:var(--green);
color:#000;
}

.complete{
background:var(--blue);
color:#fff;
}

.cancel{
background:var(--red);
color:white;
}

.whatsapp{
background:#25d366;
color:#000;
}

.no-bookings{
text-align:center;
padding:50px;
background:var(--card);
border:1px solid var(--border);
border-radius:14px;
color:var(--muted);
}

.loading{
text-align:center;
padding:40px;
color:var(--gold2);
}

/* RESPONSIVE */

@media(max-width:1000px){

.stats{
grid-template-columns:repeat(3,1fr);
}

.booking-grid{
grid-template-columns:repeat(2,1fr);
}

}

@media(max-width:650px){

.topbar{
padding:0 15px;
}

.topbar h1{
font-size:15px;
}

.container{
width:92%;
}

.stats{
grid-template-columns:1fr 1fr;
}

.controls{
grid-template-columns:1fr;
}

.booking-header{
flex-direction:column;
}

.booking-grid{
grid-template-columns:1fr;
}

.login-box{
padding:25px;
}

}

@media(max-width:400px){

.stats{
grid-template-columns:1fr;
}

}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div
class="login-page"
id="loginPage">

<div class="login-box">

<div class="logo">

<img
src="logo.jpg"
alt="Western Mona Logo">

<h1>
Western Mona
</h1>

<p>
Taxis & Safaris Admin
</p>

</div>

<div
class="error hidden"
id="loginError">
</div>

<form id="loginForm">

<label for="adminEmail">
Admin Email
</label>

<input
id="adminEmail"
type="email"
required
placeholder="admin@example.com">

<label for="adminPassword">
Password
</label>

<input
id="adminPassword"
type="password"
required
placeholder="Enter password">

<button
class="btn btn-full"
type="submit"
id="loginButton">

Login to Dashboard

</button>

</form>

</div>

</div>


<!-- ================= DASHBOARD ================= -->

<div
class="dashboard"
id="dashboard">

<header class="topbar">

<div class="topbar-left">

<img
src="logo.jpg"
class="topbar-logo"
alt="Western Mona">

<h1>
Western Mona Admin
</h1>

</div>

<button
class="logout"
id="logoutButton">

Logout

</button>

</header>


<main class="container">

<div class="welcome">

<h2>
Booking Dashboard
</h2>

<p>
Manage your Western Mona Taxis & Safaris bookings.
</p>

</div>


<!-- STATISTICS -->

<div class="stats">

<div class="stat">

<div class="stat-title">
Total Bookings
</div>

<div
class="stat-number"
id="totalBookings">
0
</div>

</div>


<div class="stat pending">

<div class="stat-title">
Pending
</div>

<div
class="stat-number"
id="pendingBookings">
0
</div>

</div>


<div class="stat confirmed">

<div class="stat-title">
Confirmed
</div>

<div
class="stat-number"
id="confirmedBookings">
0
</div>

</div>


<div class="stat completed">

<div class="stat-title">
Completed
</div>

<div
class="stat-number"
id="completedBookings">
0
</div>

</div>


<div class="stat cancelled">

<div class="stat-title">
Cancelled
</div>

<div
class="stat-number"
id="cancelledBookings">
0
</div>

</div>

</div>


<!-- SEARCH / FILTER -->

<div class="controls">

<input
id="searchBookings"
type="search"
placeholder="Search name, phone, reference, pickup or destination...">

<select id="statusFilter">

<option value="all">
All Bookings
</option>

<option value="Pending">
Pending
</option>

<option value="Confirmed">
Confirmed
</option>

<option value="Completed">
Completed
</option>

<option value="Cancelled">
Cancelled
</option>

</select>

</div>


<!-- BOOKINGS -->

<div
class="bookings"
id="bookingsList">

<div class="loading">
Loading bookings...
</div>

</div>

</main>

</div>


<script
type="module"
src="admin.js">
</script>

</body>
</html>
